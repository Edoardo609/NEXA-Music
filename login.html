<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accedi — NEXA Music</title><link rel="stylesheet" href="./theme.css"></head><body><main class="loginPage"><section class="loginCard"><div class="loginLogo">NEXA<span>MUSIC</span></div><div class="authTabs"><button type="button" class="authTab active" id="signInTab">Accedi</button><button type="button" class="authTab" id="signUpTab">Registrati</button></div><h1 id="title">Accedi a NEXA Music</h1><p id="sub">Accedi con il codice inviato alla tua email.</p><form id="loginForm"><input id="email" type="email" autocomplete="username webauthn" required placeholder="La tua email"><input id="code" class="hidden" inputmode="numeric" maxlength="6" placeholder="Codice a 6 cifre"><button class="primary" id="submit">Continua</button></form><p id="status" class="muted"></p><button id="lang" class="secondaryBtn">🇬🇧 English</button></section></main><style>.authTabs{display:flex;gap:8px;margin:0 0 18px}.authTab{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:11px 14px;border-radius:12px;font-weight:700;cursor:pointer}.authTab.active{background:var(--text);color:var(--bg)}</style><script>const A=window.hatchable?.auth||null;let step=0,email='',mode='signin';const $=s=>document.querySelector(s);const setMode=m=>{mode=m;step=0;$('#code').classList.add('hidden');$('#signInTab').classList.toggle('active',m==='signin');$('#signUpTab').classList.toggle('active',m==='signup');$('#title').textContent=m==='signup'?'Crea il tuo account':'Accedi a NEXA Music';$('#sub').textContent=m==='signup'?'Registrati gratuitamente con la tua email. Ti invieremo un codice per verificare l’account.':'Accedi con il codice inviato alla tua email.';$('#submit').textContent=m==='signup'?'Registrati':'Continua';$('#status').textContent=''};$('#signInTab').onclick=()=>setMode('signin');$('#signUpTab').onclick=()=>setMode('signup');$('#loginForm').onsubmit=async e=>{e.preventDefault();try{if(!A){if(!navigator.onLine){$('#status').textContent=mode==='signup'?'La registrazione richiede una connessione Internet.':'Per ricevere il codice serve una connessione Internet.';return}const next=encodeURIComponent(location.href.replace(/\/login\.html.*/,''));location.href='https://nexa-music.hatchable.site/login.html?next='+next;return}if(!step){email=$('#email').value.trim();const r=await A.startLogin({email});if(r.has_passkey&&A.supportsPasskeys()){try{const x=await A.signInWithPasskey({email});location.href=new URLSearchParams(location.search).get('next')||'/';return}catch{}}step=1;$('#code').classList.remove('hidden');$('#submit').textContent='Accedi';$('#status').textContent=mode==='signup'?'Codice inviato. Controlla la tua email per completare la registrazione.':'Codice inviato. Controlla la tua email.'}else{await A.verifyCode({email,code:$('#code').value.trim()});location.href=new URLSearchParams(location.search).get('next')||'/';}}catch(err){$('#status').textContent=err?.message||'Impossibile accedere. Riprova.'}};$('#lang').onclick=()=>{const en=document.documentElement.lang!=='en';document.documentElement.lang=en?'en':'it';$('#title').textContent=en?'Sign in to NEXA Music':'Accedi a NEXA Music';$('#sub').textContent=en?'Sign in or create your account with the code sent to your email.':'Accedi o crea il tuo account con il codice inviato alla tua email.';$('#email').placeholder=en?'Your email':'La tua email';$('#lang').textContent=en?'🇮🇹 Italiano':'🇬🇧 English'};</script></body></html>
